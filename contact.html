<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Une question ou une suggestion ? Contactez l’équipe CulturaZone.">
  <title>Contact – CulturaZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">CulturaZone</a>
      <nav class="nav" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a href="galerie.html">Galerie</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main id="contenu">
    <div class="wrap page-head">
      <h1>Contactez-nous</h1>
      <p class="lead">Une question ? Une suggestion ? Écrivez-nous via ce formulaire.</p>
    </div>

    <div class="wrap cols" style="padding-bottom:clamp(40px,7vw,80px)">
      <div>
        <form class="form" data-success="Merci ! Votre message a bien été envoyé.">
          <div class="field">
            <label for="nom">Nom complet</label>
            <input class="input" id="nom" type="text" name="nom" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Adresse email</label>
            <input class="input" id="email" type="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea class="input" id="message" name="message" rows="6" required></textarea>
          </div>
          <div><button class="btn" type="submit">Envoyer le message</button></div>
        </form>
        <p class="form-status" role="status"></p>
      </div>

      <ul class="contact-list">
        <li><strong>Téléphone</strong><a href="tel:+21627876977">+216 27 876 977</a></li>
        <li><strong>Email</strong><a href="mailto:yassinwannassi01@gmail.com">yassinwannassi01@gmail.com</a></li>

      </ul>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>
        <p><strong>CulturaZone</strong></p>
        <p>Créé par Yassin Wannassi</p>
      </div>
      <address>
        <a href="tel:+21627876977">📞 +216 27 876 977</a>
        <a href="mailto:yassinwannassi01@gmail.com">📧 yassinwannassi01@gmail.com</a>
      </address>
    </div>
  </footer>
</body>
</html>
